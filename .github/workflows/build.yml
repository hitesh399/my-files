name: Build Frontends

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - shell
          - auth-mfe
          - theme-mfe

    defaults:
      run:
        working-directory: apps/frontend/${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/${{ matrix.app }}/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
               
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend/${{ matrix.app }}
          file: apps/frontend/${{ matrix.app }}/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:latest


