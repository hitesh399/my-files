server {

    listen 80;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET" always;
    index index.html;
    # Shell MFE
    location / {
        proxy_pass http://shell/;       
    }

    location /auth/ {
        proxy_pass http://auth-mfe/;
    }
       location /theme/ {
       proxy_pass http://theme-mfe/;
   
    }

}